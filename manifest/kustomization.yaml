apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: poll-app

labels:
  - pairs:
      app.kubernetes.io/part-of: poll-app
    includeSelectors: false

resources:
  - namespaces/poll-app.yaml
  - configmaps/poll-config.yaml
  - configmaps/postgres-schema.yaml
  - statefulsets/postgres.yaml
  - services/postgres.yaml
  - deployments/redis.yaml
  - deployments/poll.yaml
  - deployments/worker.yaml
  - deployments/result.yaml
  - services/redis.yaml
  - services/poll.yaml

