apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  labels:
    app.kubernetes.io/name: poll
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: poll
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poll
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: poll
          image: poll:8-alpine

          ports:
            - name: http
              containerPort: 80
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: poll-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poll-secrets
                  key: REDIS_PASSWORD

          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
