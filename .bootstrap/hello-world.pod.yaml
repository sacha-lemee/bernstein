apiVersion: v1
kind: Pod
metadata:
  name: hello-world
  labels:
    app: hello-world
spec:
  containers:
    - name: hello-world
      image: nginx
      ports:
        - containerPort: 80
      env:
        - name: FOO
          value: bar
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "600m"
          memory: "128Mi"
      volumeMounts:
        - name: hello-world-volume
          mountPath: "/usr/share/nginx/html"
  volumes:
    - name: hello-world-volume
      persistentVolumeClaim:
        claimName: hello-world-pvc